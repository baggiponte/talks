# Run with prek (`uvx --from prek==0.5.7 prek install`); CI runs the zizmor hook too.
repos:
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --persona, pedantic, --no-ignores]
